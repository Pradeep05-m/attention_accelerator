<svg width="780" height="1180" viewBox="0 0 780 1180" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="780" height="1180" fill="#ffffff"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Attention Accelerator — Block Flowchart (bf16 throughout)</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#6b7280">PYNQ-Z2 (Zynq-7020)  |  all data-path pointers/streams are bf16 unless noted</text>

  <!-- PS -->
  <rect x="260" y="80" width="260" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="390" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Processing System (ARM / PYNQ Python)</text>
  <text x="390" y="118" text-anchor="middle" font-size="11" fill="#4b5563">Q, K, V arrays cast to bf16 before DMA</text>
  <line x1="390" y1="130" x2="390" y2="158" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AXI DMA in -->
  <rect x="230" y="158" width="320" height="46" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="390" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">AXI-DMA IN  +  AXI-Lite control</text>
  <text x="390" y="193" text-anchor="middle" font-size="11" fill="#1e40af">bf16* q_ptr, bf16* k_ptr, bf16* v_ptr</text>
  <line x1="390" y1="204" x2="390" y2="232" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- BRAM buffers row -->
  <rect x="90" y="232" width="180" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="180" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">Q_BUF (BRAM)</text>
  <text x="180" y="270" text-anchor="middle" font-size="10.5" fill="#5b21b6">bf16 [32][128]  (8 KB)</text>
  <text x="180" y="284" text-anchor="middle" font-size="10.5" fill="#5b21b6">resident per head</text>

  <rect x="300" y="232" width="180" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="390" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">K_BUF (BRAM, x2)</text>
  <text x="390" y="270" text-anchor="middle" font-size="10.5" fill="#5b21b6">bf16 [8][128]  double-buffered</text>
  <text x="390" y="284" text-anchor="middle" font-size="10.5" fill="#5b21b6">ping-pong per block</text>

  <rect x="510" y="232" width="180" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="600" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#4c1d95">V_BUF (BRAM, x2)</text>
  <text x="600" y="270" text-anchor="middle" font-size="10.5" fill="#5b21b6">bf16 [8][128]  double-buffered</text>
  <text x="600" y="284" text-anchor="middle" font-size="10.5" fill="#5b21b6">ping-pong per block</text>

  <line x1="180" y1="292" x2="180" y2="320" stroke="#374151" stroke-width="1.6"/>
  <line x1="390" y1="292" x2="390" y2="320" stroke="#374151" stroke-width="1.6"/>
  <line x1="600" y1="292" x2="600" y2="320" stroke="#374151" stroke-width="1.6"/>
  <line x1="180" y1="320" x2="600" y2="320" stroke="#374151" stroke-width="1.6"/>
  <line x1="390" y1="320" x2="390" y2="348" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RoPE -->
  <rect x="230" y="348" width="320" height="52" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="390" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">RoPE Unit (rotate Q, K)</text>
  <text x="390" y="386" text-anchor="middle" font-size="11" fill="#991b1b">bf16 in/out, cos/sin ROM (BRAM, no CORDIC)</text>
  <line x1="390" y1="400" x2="390" y2="428" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- MAC array -->
  <rect x="200" y="428" width="380" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390" y="450" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">MAC Array — PE_WIDTH = 16 bf16 lanes</text>
  <text x="390" y="468" text-anchor="middle" font-size="11" fill="#92400e">shared / time-multiplexed for QKᵀ  AND  weights×V</text>
  <text x="390" y="484" text-anchor="middle" font-size="11" fill="#92400e">bf16 x bf16 → fp32 accumulate (~16 DSP48 lanes)</text>
  <line x1="390" y1="498" x2="390" y2="526" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Softmax -->
  <rect x="200" y="526" width="380" height="66" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="390" y="548" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Online Softmax Unit</text>
  <text x="390" y="565" text-anchor="middle" font-size="11" fill="#166534">running max / running sum, exp() via 256-entry LUT</text>
  <text x="390" y="581" text-anchor="middle" font-size="11" fill="#166534">fp32 internal state, bf16 in/out</text>
  <line x1="390" y1="592" x2="390" y2="620" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Output accumulator -->
  <rect x="230" y="620" width="320" height="52" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="390" y="640" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">OUT_ACC_BUF (BRAM)</text>
  <text x="390" y="658" text-anchor="middle" font-size="11" fill="#5b21b6">fp32 accumulate internally → round to bf16 at writeback</text>
  <line x1="390" y1="672" x2="390" y2="700" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- AXI DMA out -->
  <rect x="230" y="700" width="320" height="46" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="390" y="718" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">AXI-DMA OUT</text>
  <text x="390" y="735" text-anchor="middle" font-size="11" fill="#1e40af">bf16* out_ptr</text>
  <line x1="390" y1="746" x2="390" y2="774" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- PS out -->
  <rect x="260" y="774" width="260" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="390" y="794" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Processing System</text>
  <text x="390" y="812" text-anchor="middle" font-size="11" fill="#4b5563">compare bf16 output vs golden reference</text>

  <!-- Control loop note box -->
  <rect x="60" y="850" width="660" height="180" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="80" y="875" font-size="13" font-weight="700" fill="#111827">Control FSM loop (drives the datapath above, per head):</text>
  <text x="80" y="898" font-size="11.5" fill="#374151">for kv_head in 0..7:                 // 8 outer iterations</text>
  <text x="80" y="916" font-size="11.5" fill="#374151">&#160;&#160;load K, V (bf16) for this kv_head</text>
  <text x="80" y="934" font-size="11.5" fill="#374151">&#160;&#160;for q_head_in_group in 0..3:      // 4 heads share this kv_head</text>
  <text x="80" y="952" font-size="11.5" fill="#374151">&#160;&#160;&#160;&#160;load Q tile (bf16), apply RoPE, reset running max/sum</text>
  <text x="80" y="970" font-size="11.5" fill="#374151">&#160;&#160;&#160;&#160;for block in 0..3:                // seq_len 32 / block_size 8</text>
  <text x="80" y="988" font-size="11.5" fill="#374151">&#160;&#160;&#160;&#160;&#160;&#160;stream K/V block (bf16, double-buffered) -&gt; MAC array -&gt; softmax update</text>
  <text x="80" y="1006" font-size="11.5" fill="#374151">&#160;&#160;&#160;&#160;write bf16 output for this head via AXI-DMA</text>

  <text x="390" y="1050" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">128 total block-iterations per full pass over all 32 query heads</text>
  <text x="390" y="1072" text-anchor="middle" font-size="11" fill="#6b7280">Target clock: 100 MHz  |  Est. DSP ~20-30 / 220  |  Est. LUT ~4-7K / 53.2K  |  BRAM ~30-35KB / 630KB</text>
  <text x="390" y="1096" text-anchor="middle" font-size="11" fill="#6b7280">All datapath ports are bf16-typed; only internal softmax/accumulate state uses fp32 for stability</text>
</svg>
